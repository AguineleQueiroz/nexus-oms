services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: ./api/.env
    command: php -S 0.0.0.0:8000 -t public
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor

  worker-payment:
    build: ./api
    command: php bin/run-worker.php
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: ./api/.env
    environment:
      WORKER_TYPE: PaymentWorker
      WORKER_ID: payment-worker-1
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor

  worker-notification:
    build: ./api
    command: php bin/run-worker.php
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: ./api/.env
    environment:
      WORKER_TYPE: NotificationWorker
      WORKER_ID: notification-worker-1
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor

  worker-fulfillment:
    build: ./api
    command: php bin/run-worker.php
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: ./api/.env
    environment:
      WORKER_TYPE: FulfillmentWorker
      WORKER_ID: fulfillment-worker-1
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor

  worker-inventory:
    build: ./api
    command: php bin/run-worker.php
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: ./api/.env
    environment:
      WORKER_TYPE: InventoryWorker
      WORKER_ID: inventory-worker-1
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor

  worker-tracking:
    build: ./api
    command: php bin/run-worker.php
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: ./api/.env
    environment:
      WORKER_TYPE: TrackingWorker
      WORKER_ID: tracking-worker-1
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor

  worker-audit:
    build: ./api
    command: php bin/run-worker.php
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: ./api/.env
    environment:
      WORKER_TYPE: AuditWorker
      WORKER_ID: audit-worker-1
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor

  dashboard:
    build: ./dashboard
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./dashboard:/app
      - /app/node_modules

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oms
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d oms" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  api_vendor:
